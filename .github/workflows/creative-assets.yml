# Mirror Meta ad creatives (copy, thumbnail, full asset) into BigQuery + GCS.
#
# Runs infra/creative_assets_job.py every 2 hours. Setup, secrets and IAM:
# runbooks/33_creative_assets_schedule.md. Nothing here holds a credential;
# the job authenticates as a GCP service account through the repository
# secrets below and reads the Meta tokens from Secret Manager itself.
#
# Scheduled workflows only run from the DEFAULT branch, so this file does
# nothing until it is merged to main.

name: Creative assets mirror

on:
  schedule:
    # Minute 40, every second hour (UTC): clear of the hourly :15 Meta insights
    # load, so the delivering-ads list it reads is fresh.
    - cron: "40 */2 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments, e.g. '--reshape' or 'manami --all' (empty = scheduled behaviour)"
        required: false
        default: ""

concurrency:
  group: creative-assets
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # only used by the Workload Identity path

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Mapped to env so the auth steps can test which path is configured
      # (`secrets` cannot be read in an `if:`).
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements-creative-assets.txt

      - name: Install dependencies
        run: pip install -r infra/requirements-creative-assets.txt

      # Preferred: keyless, via Workload Identity Federation.
      - name: Authenticate to Google Cloud (Workload Identity)
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Fallback: a JSON key for the same service account.
      - name: Authenticate to Google Cloud (JSON key)
        if: env.WIF_PROVIDER == '' && env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Check that a credential was configured
        if: env.WIF_PROVIDER == '' && env.HAS_SA_KEY != 'true'
        run: |
          echo "::error::No GCP credential. Add GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT, or GCP_SA_KEY (runbooks/33_creative_assets_schedule.md)."
          exit 1

      - name: Mirror creatives
        env:
          ARGS: ${{ github.event.inputs.args }}
          PYTHONUNBUFFERED: "1"
        # ARGS is split on whitespace on purpose: client ids and flags only.
        run: python infra/creative_assets_job.py $ARGS
